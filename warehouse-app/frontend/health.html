<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة مراقبة النظام</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --success: #27ae60;
            --danger: #e74c3c;
            --warning: #f39c12;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --muted: #6c757d;
            --border: #e1e4e8;
        }

        [data-theme="dark"] {
            --bg: #0f1419;
            --card-bg: #1e2533;
            --text: #e0e0e0;
            --muted: #95a5a6;
            --border: #2c3e50;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
            transition: background 0.3s, color 0.3s;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        .header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 1.5rem 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header h1 { font-size: 1.6rem; }

        .header-actions { display: flex; gap: 0.5rem; }

        .btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95rem;
            transition: background 0.2s;
        }

        .btn:hover { background: rgba(255,255,255,0.3); }

        .btn-primary {
            background: var(--secondary);
            border-color: var(--secondary);
        }

        .status-badge {
            display: inline-block;
            padding: 0.3rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .status-healthy { background: var(--success); color: white; }
        .status-warning { background: var(--warning); color: white; }
        .status-error { background: var(--danger); color: white; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            transition: transform 0.2s;
        }

        .card:hover { transform: translateY(-2px); }

        .card-title {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text);
        }

        .card-subtitle {
            color: var(--muted);
            font-size: 0.85rem;
            margin-top: 0.3rem;
        }

        .progress-bar {
            background: var(--border);
            border-radius: 10px;
            height: 8px;
            margin-top: 0.5rem;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s;
        }

        .progress-ok { background: var(--success); }
        .progress-warning { background: var(--warning); }
        .progress-danger { background: var(--danger); }

        .section-title {
            font-size: 1.3rem;
            margin: 2rem 0 1rem;
            color: var(--text);
            border-right: 4px solid var(--secondary);
            padding-right: 0.8rem;
        }

        .activity-list {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .activity-item {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .activity-item:last-child { border-bottom: none; }

        .activity-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .icon-create { background: #d4edda; color: var(--success); }
        .icon-update { background: #fff3cd; color: var(--warning); }
        .icon-delete { background: #f8d7da; color: var(--danger); }

        .activity-details { flex: 1; }

        .activity-desc { font-weight: 500; }

        .activity-time { color: var(--muted); font-size: 0.85rem; }

        .login-prompt {
            text-align: center;
            padding: 3rem;
        }

        .login-form {
            max-width: 400px;
            margin: 2rem auto;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .login-form input {
            width: 100%;
            padding: 0.8rem;
            margin: 0.5rem 0;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
            font-family: inherit;
            font-size: 1rem;
        }

        .login-form button {
            width: 100%;
            padding: 0.8rem;
            background: var(--secondary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            margin-top: 0.5rem;
        }

        .error { color: var(--danger); margin-top: 0.5rem; }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border);
        }

        .info-row:last-child { border-bottom: none; }

        .info-label { color: var(--muted); }

        @media (max-width: 768px) {
            body { padding: 1rem; }
            .header { padding: 1rem; }
            .card-value { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div id="app" class="container">
        <div class="login-prompt" id="login-prompt">
            <h1>🔐 لوحة مراقبة النظام</h1>
            <p style="color: var(--muted); margin: 1rem 0;">الرجاء تسجيل الدخول كمدير</p>
            <form class="login-form" id="login-form">
                <input type="text" id="username" placeholder="اسم المستخدم" required>
                <input type="password" id="password" placeholder="كلمة المرور" required>
                <button type="submit">دخول</button>
                <div id="error" class="error"></div>
            </form>
        </div>

        <div id="dashboard" style="display: none;">
            <div class="header">
                <h1>📊 لوحة مراقبة النظام</h1>
                <div class="header-actions">
                    <span class="status-badge status-healthy" id="overall-status">✓ سليم</span>
                    <button class="btn" id="theme-toggle">🌙</button>
                    <button class="btn" id="refresh-btn">🔄 تحديث</button>
                    <button class="btn" id="logout-btn">خروج</button>
                </div>
            </div>

            <h2 class="section-title">📈 ملخص النظام</h2>
            <div class="grid">
                <div class="card">
                    <div class="card-title">⚡ المعالج (CPU)</div>
                    <div class="card-value" id="cpu-value">0%</div>
                    <div class="progress-bar"><div class="progress-fill" id="cpu-bar" style="width: 0%"></div></div>
                </div>
                <div class="card">
                    <div class="card-title">💾 الذاكرة</div>
                    <div class="card-value" id="mem-value">0%</div>
                    <div class="card-subtitle" id="mem-detail">0 / 0 MB</div>
                    <div class="progress-bar"><div class="progress-fill" id="mem-bar" style="width: 0%"></div></div>
                </div>
                <div class="card">
                    <div class="card-title">💿 القرص</div>
                    <div class="card-value" id="disk-value">0%</div>
                    <div class="card-subtitle" id="disk-detail">0 / 0 GB</div>
                    <div class="progress-bar"><div class="progress-fill" id="disk-bar" style="width: 0%"></div></div>
                </div>
                <div class="card">
                    <div class="card-title">🗄️ قاعدة البيانات</div>
                    <div class="card-value" id="db-size">0 MB</div>
                    <div class="card-subtitle" id="db-status">متصل</div>
                </div>
            </div>

            <h2 class="section-title">📊 إحصائيات قاعدة البيانات</h2>
            <div class="grid">
                <div class="card">
                    <div class="card-title">📦 الأصناف</div>
                    <div class="card-value" id="stat-items">0</div>
                </div>
                <div class="card">
                    <div class="card-title">🏭 المستودعات</div>
                    <div class="card-value" id="stat-warehouses">0</div>
                </div>
                <div class="card">
                    <div class="card-title">🔄 الحركات</div>
                    <div class="card-value" id="stat-transactions">0</div>
                </div>
                <div class="card">
                    <div class="card-title">👥 المستخدمون</div>
                    <div class="card-value" id="stat-users">0</div>
                </div>
            </div>

            <h2 class="section-title">📋 آخر النشاطات</h2>
            <div class="activity-list" id="activity-list"></div>

            <h2 class="section-title">ℹ️ معلومات النظام</h2>
            <div class="card">
                <div id="system-info"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let authToken = localStorage.getItem('health_token');

        // Theme
        const themeToggle = document.getElementById('theme-toggle');
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeToggle.textContent = '☀️';
        }
        themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                themeToggle.textContent = '🌙';
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeToggle.textContent = '☀️';
                localStorage.setItem('theme', 'dark');
            }
        });

        // Login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                if (!res.ok) {
                    document.getElementById('error').textContent = 'بيانات الدخول غير صحيحة';
                    return;
                }
                const data = await res.json();
                authToken = data.access_token;
                localStorage.setItem('health_token', authToken);
                showDashboard();
            } catch (err) {
                document.getElementById('error').textContent = 'خطأ في الاتصال';
            }
        });

        // Logout
        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('health_token');
            authToken = null;
            location.reload();
        });

        // Refresh
        document.getElementById('refresh-btn').addEventListener('click', () => {
            loadDashboard();
        });

        // Auto refresh every 30 seconds
        setInterval(() => {
            if (authToken) loadDashboard();
        }, 30000);

        function showDashboard() {
            document.getElementById('login-prompt').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            loadDashboard();
        }

        function getProgressClass(percent) {
            if (percent > 90) return 'progress-danger';
            if (percent > 70) return 'progress-warning';
            return 'progress-ok';
        }

        function formatTime(iso) {
            if (!iso) return '-';
            const d = new Date(iso);
            return d.toLocaleString('ar-EG');
        }

        function getActionIcon(action) {
            return { create: 'icon-create', update: 'icon-update', delete: 'icon-delete' }[action] || 'icon-update';
        }

        function getActionEmoji(action) {
            return { create: '➕', update: '✏️', delete: '🗑️' }[action] || '📝';
        }

        async function loadDashboard() {
            try {
                const res = await fetch(`${API_BASE}/admin/health-dashboard`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                if (res.status === 401) {
                    localStorage.removeItem('health_token');
                    location.reload();
                    return;
                }
                if (!res.ok) {
                    console.error('Failed to load dashboard');
                    return;
                }
                const data = await res.json();
                renderDashboard(data);
            } catch (err) {
                console.error('Error:', err);
            }
        }

        function renderDashboard(data) {
            // Status
            const status = data.status || 'healthy';
            const statusEl = document.getElementById('overall-status');
            statusEl.textContent = status === 'healthy' ? '✓ سليم' : '⚠ تحذير';
            statusEl.className = 'status-badge ' + (status === 'healthy' ? 'status-healthy' : 'status-warning');

            // Server
            const server = data.server || {};
            document.getElementById('cpu-value').textContent = server.cpu_percent + '%';
            const cpuBar = document.getElementById('cpu-bar');
            cpuBar.style.width = server.cpu_percent + '%';
            cpuBar.className = 'progress-fill ' + getProgressClass(server.cpu_percent);

            const mem = server.memory || {};
            document.getElementById('mem-value').textContent = mem.percent + '%';
            document.getElementById('mem-detail').textContent = `${mem.used_mb} / ${mem.total_mb} MB`;
            const memBar = document.getElementById('mem-bar');
            memBar.style.width = mem.percent + '%';
            memBar.className = 'progress-fill ' + getProgressClass(mem.percent);

            const disk = server.disk || {};
            document.getElementById('disk-value').textContent = disk.percent + '%';
            document.getElementById('disk-detail').textContent = `${disk.used_gb} / ${disk.total_gb} GB`;
            const diskBar = document.getElementById('disk-bar');
            diskBar.style.width = disk.percent + '%';
            diskBar.className = 'progress-fill ' + getProgressClass(disk.percent);

            // Database
            const db = data.database || {};
            document.getElementById('db-size').textContent = db.size_mb + ' MB';
            document.getElementById('db-status').textContent = db.status === 'connected' ? '✓ متصل' : '✕ غير متصل';

            // Stats
            const records = db.records || {};
            document.getElementById('stat-items').textContent = records.items || 0;
            document.getElementById('stat-warehouses').textContent = records.warehouses || 0;
            document.getElementById('stat-transactions').textContent = records.transactions || 0;
            document.getElementById('stat-users').textContent = records.users || 0;

            // Activities
            const activities = data.recent_activities || [];
            const list = document.getElementById('activity-list');
            list.innerHTML = activities.length ? activities.map(a => `
                <div class="activity-item">
                    <div class="activity-icon ${getActionIcon(a.action)}">
                        ${getActionEmoji(a.action)}
                    </div>
                    <div class="activity-details">
                        <div class="activity-desc">${a.description || '-'}</div>
                        <div class="activity-time">${formatTime(a.timestamp)} • المستخدم #${a.user_id || '-'}</div>
                    </div>
                </div>
            `).join('') : '<div class="activity-item">لا توجد نشاطات</div>';

            // System info
            const sys = data.system || {};
            document.getElementById('system-info').innerHTML = `
                <div class="info-row"><span class="info-label">المنصة</span><span>${sys.platform} ${sys.platform_version}</span></div>
                <div class="info-row"><span class="info-label">إصدار Python</span><span>${sys.python_version}</span></div>
                <div class="info-row"><span class="info-label">المعالج</span><span>${sys.processor}</span></div>
                <div class="info-row"><span class="info-label">آخر تحديث</span><span>${formatTime(data.timestamp)}</span></div>
            `;
        }

        // Auto-login if token exists
        if (authToken) showDashboard();
    </script>
</body>
</html>
